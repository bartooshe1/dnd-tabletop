name: test-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Token budget (both tool sets)
        run: npm run measure
      - name: Committed Claude Code plugin bundle is up to date
        run: npm run check:plugin

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin and marketplace with Claude Code (no login needed)
        run: |
          npx -y @anthropic-ai/claude-code plugin validate ./plugin
          npx -y @anthropic-ai/claude-code plugin validate .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, validate-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - name: Build the .mcpb and the plugin
        run: npm run build
      - name: The plugin in the tag matches a fresh build
        run: git diff --exit-code -- plugin/
      - name: Smoke-test the packed bundle
        run: node scripts/smoke-mcpb.mjs "dist/dnd-tabletop-${GITHUB_REF_NAME#v}.mcpb" "$RUNNER_TEMP/unpacked" show_map '{}' roll '{"dice":"1d20"}' notes '{}'
      - name: Zip the Claude Code plugin (for people who don't use the marketplace)
        run: cd plugin && zip -r "../dist/dnd-tabletop-plugin-${GITHUB_REF_NAME#v}.zip" . -x '.mcpb-cache/*'
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dnd-tabletop-*.mcpb
            dist/dnd-tabletop-plugin-*.zip
          generate_release_notes: true
